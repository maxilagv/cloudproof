name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test

  docker-integration:
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 35
    env:
      PROOF_DOCKER_IT: "1"
      PROOF_DOCKER_IT_FULL: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Secuencial: estas suites verifican labels/limpieza global y no deben
      # barrer los recursos efímeros de otra suite en paralelo.
      - run: pnpm --filter @proof/docker-executor exec vitest run tests/integration.test.ts --no-file-parallelism
      - run: pnpm --filter @proof/cli exec vitest run tests/e2e.test.ts --no-file-parallelism
      - run: pnpm --filter @proof/cli exec vitest run tests/reproduce.integration.test.ts --no-file-parallelism
